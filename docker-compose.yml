version: '3.8'

services:
  # Redis for HNSW vector search
  redis:
    image: redis/redis-stack:7.2.0-v10
    container_name: semcache-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1000 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semcache-net

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: semcache-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - semcache-net

  # Semantic cache benchmark application
  semcache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semcache-benchmark
    ports:
      - "8080:8080"
      - "9090:9090"  # Prometheus metrics
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./data:/app/data
      # Mount secrets from external file (NOT in git)
      - ./secrets/application-secrets.yml:/app/config/application-secrets.yml:ro
    environment:
      - JAVA_OPTS=-Xmx8g -Xms4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - SPRING_PROFILES_ACTIVE=benchmark
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/app/config/
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - semcache-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 8G

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: semcache-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - semcache-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: semcache-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - semcache-net

volumes:
  redis-data:
  ollama-data:
  prometheus-data:
  grafana-data:

networks:
  semcache-net:
    driver: bridge
