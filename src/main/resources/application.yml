# ============================================
# Semantic Cache Benchmark Configuration
# ============================================
# All parameters in one file — no hardcoded values (M.8 compliance)

spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 50   # Reduced for 16GB RAM (was 512)
          max-idle: 25     # Reduced (was 256)
          min-idle: 10     # Reduced (was 32)
          max-wait: 10000ms
        shutdown-timeout: 10000ms
      timeout: 5000ms      # Connection timeout
      connect-timeout: 5000ms  # Explicit connect timeout
  application:
    name: semantic-cache-benchmark


# ============================================
# Semantic Cache Configuration
# ============================================
cache:
  # Enable HNSW (RedisSearch) — set to false for Brute-force ablation study (§5.5)
  hnsw-enabled: true

  # Similarity threshold (θ) — sweep values: 0.80, 0.85, 0.90, 0.95
  similarityThreshold: 0.90
  
  # Number of nearest neighbors for KNN search
  knn-k: 5
  
  # Maximum cache entries
  max-entries: 50000
  
  # TTL in seconds (86400 = 24 hours)
  ttl-seconds: 86400
  
  # Cache strategy: SEMANTIC, EXACT_MATCH, NONE
  strategy: SEMANTIC
  
  # HNSW index parameters
  hnsw:
    m: 16
    ef-construction: 200
    ef-runtime: 100

# ============================================
# Embedding Model Configuration
# ============================================
embedding:
  # Model name: minilm, mpnet, tinybert
  model-name: minilm
  
  # Model paths (ONNX format)
  models:
    minilm:
      path: models/all-MiniLM-L6-v2/model.onnx
      tokenizer-path: models/all-MiniLM-L6-v2/vocab.txt
      dimension: 384
      # T2: MiniLM is optimized for short sequences; 128 is its practical max
      max-sequence-length: 128
    mpnet:
      path: models/all-mpnet-base-v2/model.onnx
      tokenizer-path: models/all-mpnet-base-v2/vocab.txt
      dimension: 768
      # T2: MPNet supports up to 384 tokens — use its full capacity
      max-sequence-length: 384
    tinybert:
      path: models/paraphrase-TinyBERT-L6-v2/model.onnx
      tokenizer-path: models/paraphrase-TinyBERT-L6-v2/vocab.txt
      dimension: 312
      max-sequence-length: 128
  
  # Default maximum input token length (fallback when model-specific not set)
  max-length: 256

# ============================================
# LLM Configuration
# ============================================
llm:
  # Provider: gemini (API) veya ollama (yerel)
  provider: ollama
  
  # Gemini API ayarları (provider: gemini için)
  model: gemini-2.5-flash
  temperature: 0.0
  max-output-tokens: 1024
  api-keys: ${GEMINI_API_KEYS:REPLACE_ME}
  
  # Ollama yerel model ayarları (provider: ollama için)
  ollama:
    url: http://localhost:11434
    model: llama3.2:3b  # Yüklü model adı (ollama list ile kontrol edin)
    temperature: 0.0
    max-tokens: 1024
    timeout-seconds: 600  # 10 dakika - yerel model için uzun timeout

# ============================================
# Benchmark Configuration
# ============================================
benchmark:
  # TTL in seconds for cache entries (86400 = 24 hours)
  ttl-seconds: 86400

  # Random seeds for reproducibility (5 independent runs)
  seeds: [42, 123, 456, 789, 1024]
  
  # Concurrent user levels for throughput test
  concurrent-users: [10, 25, 50, 100]
  
  # S3: Configurable warmup ratio (fraction of dataset used for cache pre-population)
  warmup-ratio: 0.30
  
  # Zipfian skew parameter (s) — 0.0 = uniform, 0.7-1.0 = realistic skew (§5.4)
  zipfian-skew: 0.0
  
  # Adversarial noise injection probability [0,1] (§5.6)
  noise-probability: 0.0

  # Throughput test parameters (§5.7) — previously hardcoded, now configurable (M.8)
  # Total number of requests per throughput trial
  throughput-total-requests: 2000
  # Zipfian exponent for throughput query generation; 0.9–1.2 is realistic for search workloads
  throughput-zipf-exponent: 1.1

  # Execution tuning
  batch-size: 100
  parallelism: 4
  
  # Datasets (size auto-detected from file, or override with -Dbenchmark.dataset-size=100000)
  dataset-size: 0  # 0 = auto-detect from file
  datasets:
    - name: msmarco
      path: data/msmarco_sample_with_paraphrases.jsonl
    - name: natural-questions
      path: data/nq_sample_with_paraphrases.jsonl
    - name: quora-pairs
      path: data/qqp_sample_with_paraphrases.jsonl

# ============================================
# Metrics & Monitoring
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: semantic-cache-benchmark
    distribution:
      percentiles-histogram:
        http.server.requests: true
        llm.latency: true
        embedding.latency: true
        cache.lookup.latency: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

server:
  port: 0

---
# ============================================
# Benchmark Profile — CLI-only mode
# ============================================
# Activated via: -Dspring.profiles.active=benchmark,benchmark-mock
spring:
  config:
    activate:
      on-profile: benchmark
  main:
    # Disable embedded web server when running in benchmark mode.
    # Benchmarks run as CommandLineRunner — no HTTP endpoint needed.
    # This prevents port 8181 conflicts between consecutive experiment runs.
    web-application-type: NONE

---
# ============================================
# Benchmark Mock Profile — 0-cost LLM simulation
# ============================================
# Activated via: -Dspring.profiles.active=benchmark,benchmark-mock
# Uses MockGeminiService with ground-truth registry instead of real LLM API.
# All LLM calls return pre-registered ground-truth answers from the dataset.
spring:
  config:
    activate:
      on-profile: benchmark-mock

# Override LLM provider to indicate mock mode is active
llm:
  provider: mock
