name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Code Quality and Security
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Check for secrets in code
        run: |
          if grep -r "AIzaSy" src/ || grep -r "sk-" src/; then
            echo "❌ API keys found in source code!"
            exit 1
          fi
          echo "✅ No API keys found"
      
      - name: Maven dependency check
        run: mvn dependency:analyze
      
      - name: Checkstyle
        run: mvn checkstyle:check || true

  # Job 2: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean compile -B
      
      - name: Run unit tests
        run: mvn test -B
      
      - name: Generate coverage report
        run: mvn jacoco:report
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'Total.*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+' | head -1)
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Coverage below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage meets 80% threshold"

  # Job 3: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      redis:
        image: redis/redis-stack:7.2.0-v10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run integration tests
        run: mvn verify -Pintegration-tests -B
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # Job 4: Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: semcache-benchmark:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm semcache-benchmark:test java -version
          docker run --rm semcache-benchmark:test mvn -version

  # Job 5: Python Analysis Scripts
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt
      
      - name: Lint Python code
        run: |
          pip install flake8 black
          flake8 scripts/*.py --max-line-length=100 || true
          black --check scripts/*.py || true
      
      - name: Test analysis scripts
        run: |
          python3 scripts/validate_experiment.py || true
          python3 scripts/power_analysis.py --effect-size 0.8

  # Job 6: Reproducibility Check
  reproducibility:
    runs-on: ubuntu-latest
    needs: [build-and-test, python-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          cd scripts
          pip install -r requirements.txt
      
      - name: Profile hardware
        run: |
          python3 scripts/hardware_profiler.py --output hardware_specs.json
          cat hardware_specs.json
      
      - name: Generate dependency lock
        run: |
          mvn dependency:tree > dependency-tree.txt
          pip freeze > requirements-locked.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-artifacts
          path: |
            hardware_specs.json
            dependency-tree.txt
            requirements-locked.txt

  # Job 7: Security Scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 8: Publish Results (only on main branch)
  publish:
    runs-on: ubuntu-latest
    needs: [docker-build, reproducibility, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/semcache-benchmark:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/semcache-benchmark:${{ github.sha }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/*.jar
            dependency-tree.txt
            hardware_specs.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
